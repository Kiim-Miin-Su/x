<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
    <link rel="stylesheet" href="./style.css" />
</head>

<body>
    <form class="form_sign_up">
        <label for="user_id">아이디</label>
        <input type="text" id="user_id" placeholder="아이디를 입력하세요" />

        <label for="user_pw">비밀번호</label>
        <input type="password" id="user_pw" placeholder="비밀번호를 입력하세요" />

        <label for="user_name">이름</label>
        <input type="text" id="user_name" placeholder="이름을 입력하세요" />

        <label for="ssn1">주민등록번호 앞자리</label>
        <input type="text" id="user_ssn1" placeholder="주민등록번호 앞자리" maxlength="6" />

        <label for="ssn2">주민등록번호 뒷자리</label>
        <input type="text" id="user_ssn2" placeholder="주민등록번호 뒷자리" maxlength="7" />

        <label for="email">이메일</label>
        <input type="email" id="user_email" placeholder="이메일을 입력하세요" />

        <label for="phone">전화번호</label>
        <input type="text" id="user_phone" placeholder="전화번호를 입력하세요" />

        <label for="address1">주소</label>
        <input type="text" id="user_address1" placeholder="주소를 입력하세요" />

        <label for="address2">상세 주소</label>
        <input type="text" id="user_address2" placeholder="상세 주소를 입력하세요" />

        <label for="birth">생년월일</label>
        <input type="date" id="user_birth" />

        <div class="radio_gender" id="user_gender">
            <p>성별</p>
            <label for="radio_male">남성</label>
            <input type="radio" name="gender" id="radio_male" value="male" />

            <label for="radio_female">여성</label>
            <input type="radio" name="gender" id="radio_female" value="female" />
        </div>

        <button type="button" id="try_sign_up">회원가입</button>
    </form>
</body>

<script src="./sign_up.js"></script>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
    let isAddressVerified = false;

    const user_address1 = document.getElementById("user_address1");

    // 주소창 클릭 → 다음 주소 검색창 열기
    user_address1.addEventListener("click", function () {
        new daum.Postcode({
            oncomplete: function (data) {
                user_address1.value = data.address;
                isAddressVerified = true; // 주소 선택되었음
                console.log("주소 인증 완료");
            }
        }).open();
    });

    // 주소 필드 값이 바뀌면 검증 플래그 초기화
    user_address1.addEventListener("input", function () {
        isAddressVerified = false; // 사용자가 수정함
        console.log("주소 직접 수정됨 → 재선택 필요");
    });


</script>

</html>
